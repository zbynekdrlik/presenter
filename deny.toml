# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
# This is the SINGLE source of advisory ignores for cargo-DENY. The cargo-AUDIT
# side has its own ignore list in .cargo/audit.toml (the file cargo-audit reads)
# — the two tools are configured separately on purpose (#366). Keep this list in
# mind when updating advisory ignores: a RUSTSEC may need ignoring in both files.
# Ignore unmaintained crates where no alternative exists (transitive deps)
ignore = [
    # paste is unmaintained but required by leptos; no safe upgrade path
    # https://rustsec.org/advisories/RUSTSEC-2024-0436
    "RUSTSEC-2024-0436",
    # proc-macro-error2 is unmaintained but pulled in transitively by both
    # leptos (leptos_macro / reactive_stores_macro / syn_derive) and sea-orm
    # (sea-bae). Build-time proc-macro dep only, not a runtime vulnerability;
    # no upgrade path until those frameworks migrate (dependency-refresh #343).
    # https://rustsec.org/advisories/RUSTSEC-2026-0173
    "RUSTSEC-2026-0173",
    # quick-xml 0.39.4 DoS-class advisories, fixed only in >=0.41.0 — pinned
    # transitively by gst-plugin-ndi (^0.39; 0.15.3 still pins ^0.40). NDI XML
    # comes only from trusted-LAN sources. Tracked in #522 — remove both here
    # AND in .cargo/audit.toml once gst-plugin-ndi allows quick-xml >=0.41.
    # https://rustsec.org/advisories/RUSTSEC-2026-0194
    "RUSTSEC-2026-0194",
    # https://rustsec.org/advisories/RUSTSEC-2026-0195
    "RUSTSEC-2026-0195",
    # event-listener 5.4.1 StackSlot soundness issue — transitive via
    # async-lock 3.4.2 → reactive_graph → leptos 0.7.8. INFO Unsound; we do
    # not use the listener! macro or custom tags, so the unsafe path is
    # unreachable. No upgrade path until async-lock bumps its event-listener
    # requirement (>=5.4.2 patched). Same pattern as the leptos entries above.
    # Keep in sync with .cargo/audit.toml.
    # https://rustsec.org/advisories/RUSTSEC-2026-0221
    "RUSTSEC-2026-0221",
    # rkyv 0.7.46 insufficient archive validation can cause out-of-bounds
    # reads in archives containing Rc/Arc. Optional dependency of
    # rust_decimal 1.41.0, which sea-orm 1.1.20 depends on DIRECTLY (#622
    # post-merge review finding 12 — this used to say "transitive via sea-orm
    # → sqlx", which is wrong: sqlx 0.8.6 also depends on rust_decimal
    # directly and independently, there is no sea-orm→sqlx→rust_decimal
    # chain). The feature that pulls rkyv is never enabled in our dependency
    # graph — `cargo tree -i rkyv` prints nothing, so the code is never
    # compiled. No upgrade path until sea-orm/sqlx move off rust_decimal
    # 1.41.0 (fix requires rkyv >=0.8.17). Keep in sync with .cargo/audit.toml.
    # https://rustsec.org/advisories/RUSTSEC-2026-0235
    "RUSTSEC-2026-0235",
]

[licenses]
version = 2
confidence-threshold = 0.92

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Allow wildcards for workspace crates (internal dependencies)
wildcards = "allow"
highlight = "all"

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
