# SOTA 2025 Cargo build configuration

[build]
# #585: incremental compilation disabled — the `incremental/` scratch cache
# grew to 29 GB on dev2, dominated by full `cargo test` / `cargo clippy
# --all-targets` sweeps and build-ui.sh, where incremental buys little
# wall-clock but costs real disk (also shared with bakerion-ai's own
# target/ on the same disk). Under Tier-0 (#592), builds run on CI runners
# where incremental cache is irrelevant (fresh runner per job). See
# .claude/skills/deploy for the purge one-liner + disk-size expectations.
incremental = false

# Use LLD linker for faster linking on Linux
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Environment variables for build
[env]
# #594: this [env] entry is INERT for Cargo's own incremental decision —
# Cargo's [env] table sets variables for processes Cargo *spawns*, it does
# NOT read [env] back for its own configuration (verified empirically on
# cargo 1.97.0: a forced CARGO_TARGET_DIR was ignored by `cargo metadata`,
# while a real process env var won — CARGO_INCREMENTAL goes through the same
# accessor). The actual #585 disk fix is `[build] incremental = false` above
# + `[profile.dev] incremental = false` below — those are what Cargo reads.
# Kept here (with `force = true`) only because it DOES help a nested cargo
# invocation spawned by a build script — real protection against a shell
# that exports CARGO_INCREMENTAL for the top-level build would instead need
# a guard in scripts/dev/quality-check.sh / scripts/build-ui.sh.
CARGO_INCREMENTAL = { value = "0", force = true }

# Alias definitions for common tasks
[alias]
# Testing aliases
t = "test"
tt = "test --all-targets"

# Linting aliases
lint = "clippy --all-targets --all-features -- -D warnings"
lint-fix = "clippy --all-targets --all-features --fix --allow-dirty"

# Code quality
fmt-check = "fmt --all -- --check"

# Documentation
doc-open = "doc --open --no-deps"

# Build profiles
[profile.dev]
opt-level = 0
debug = true
# #585: an explicit per-profile `incremental` setting takes precedence over
# [build] incremental above — both must say false, or dev/test/clippy builds
# (all profile.dev-derived) would keep incremental ON regardless.
incremental = false

[profile.dev.package."*"]
opt-level = 2  # Optimize dependencies even in dev

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.test]
opt-level = 1  # Slight optimization for faster test execution
debug = true

# Profile for CI (faster builds, some optimization)
[profile.ci]
inherits = "dev"
incremental = false
opt-level = 1

[registries.crates-io]
protocol = "sparse"
