# Empty [workspace] table (#669): this crate is deliberately EXCLUDED from the
# root workspace (`exclude = ["crates/presenter-ui"]` in the root Cargo.toml,
# own Cargo.lock) and relies on cargo treating it as a standalone package.
# Without this table, cargo's ancestor-directory workspace-root discovery has
# no boundary awareness — from a NORMAL checkout it happens to stop at the
# root Cargo.toml (whose relative-path exclude matches), but from a NESTED
# git worktree (`.claude/worktrees/<name>/crates/presenter-ui`, the default
# `/autopilot` isolation mode since #317) the walk climbs PAST the worktree's
# own root and reaches the outer checkout's Cargo.toml, whose exclude is
# relative to ITS OWN root and never matches the nested path — so cargo
# refuses with "believes it's in a workspace when it's not". This table makes
# cargo's very first manifest check return `Root` for this crate immediately,
# so that ancestor walk never runs — immune to nesting depth, and it also
# fixes rust-analyzer/IDE tooling in a worktree. Value-neutral: the crate has
# no `.workspace = true` inheritance and already resolves independently via
# its own Cargo.lock.
[workspace]

[package]
name = "presenter-ui"
version = "0.1.43"
edition = "2021"
authors = ["Presenter Team <drlik.zbynek@gmail.com>"]
license = "MIT"
repository = "https://github.com/zbynekdrlik/presenter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
presenter-core = { path = "../presenter-core" }
leptos = { version = "0.7", default-features = false, features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { version = "1.8", features = ["serde", "v4", "js"] }
gloo-net = { version = "0.6", features = ["websocket", "http"] }
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "BinaryType",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "DataTransfer",
    "Document",
    "DomRect",
    "DomStringMap",
    "DomTokenList",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FormData",
    "Headers",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "HtmlVideoElement",
    "ImageBitmap",
    "KeyboardEvent",
    "Location",
    "MediaStream",
    "MediaStreamTrack",
    "MessageEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Performance",
    "PointerEvent",
    "PopStateEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "RtcConfiguration",
    "RtcIceConnectionState",
    "RtcIceGatheringState",
    "RtcPeerConnection",
    "RtcRtpCapabilities",
    "RtcRtpReceiver",
    "RtcRtpTransceiver",
    "RtcRtpTransceiverDirection",
    "RtcRtpTransceiverInit",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcTrackEvent",
    "Screen",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Storage",
    "TextDecoder",
    "Url",
    "UrlSearchParams",
    "VisibilityState",
    "WebSocket",
    "Window",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
log = "0.4"
futures-util = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
urlencoding = "2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
