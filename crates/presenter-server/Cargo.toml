[package]
name = "presenter-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
presenter-core = { path = "../presenter-core" }
presenter-persistence = { path = "../presenter-persistence" }
presenter-importer = { path = "../presenter-importer" }
presenter-bible = { path = "../presenter-bible" }
presenter-ndi = { path = "../presenter-ndi" }
bytes = "1"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
leptos.workspace = true
reactive_graph.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
serde_with.workspace = true
reqwest.workspace = true
rosc = "0.10"
include_dir = "0.7"
async-stream = "0.3"
regex = "1"
async-trait.workspace = true

[features]
default = []
mock-integrations = []
test-helpers = ["presenter-ndi/test-helpers"]
# #680: the ai_eval harness driver (src/bin/ai_eval/). Non-default — a plain
# `cargo build`/`cargo check`/`cargo test` never compiles it. Zero new
# dependencies: the CLI args are hand-parsed (matching run.sh's own style),
# and everything else (AppState, run_agent, the real packer/validator) is
# already a normal dependency of this package.
ai-eval = []

# `ai_eval` is `required-features`-gated so it is invisible to a default
# build/check/test (report §6.2 / #680 acceptance: "cargo check --workspace
# --tests must stay unaffected when the feature is off"). This entry is
# NOT optional plumbing: Cargo's `src/bin/*` autodiscovery picks up
# `src/bin/ai_eval/main.rs` the moment the file exists on disk REGARDLESS of
# whether this `[[bin]]` block is present — confirmed empirically (a default
# `cargo check` failed to compile the bin unconditionally without this
# `required-features` gate) — so the file and this entry must always land
# together. Directory form (`src/bin/ai_eval/main.rs`, not a single
# `ai_eval.rs`) because the driver + Layer-1 scorer + their unit tests do
# not fit one file under this project's 800/1000-line file-size cap — same
# binary name, same invocation either way.
[[bin]]
name = "ai_eval"
path = "src/bin/ai_eval/main.rs"
required-features = ["ai-eval"]

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
# Direct entity queries in sync integration tests (#558 round-4 U1) to
# corrupt a stored slide's raw column value/id, simulating a legacy row —
# test-only, never used by production code.
sea-orm.workspace = true
# test-util enables tokio's pausable clock (start_paused / advance) used by the
# #484 backoff window test — no wall-clock sleeping. Additive over the workspace
# tokio features; only affects the test build.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
presenter-persistence = { path = "../presenter-persistence" }
wiremock = "0.6"
tempfile = "3.10"
# Real WebSocket client for the /live/ws integration test (#471). Version
# matches the tokio-tungstenite axum's `ws` feature already pulls in.
tokio-tungstenite = "0.29"

