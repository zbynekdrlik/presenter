name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # apt is ~1 min; a stalled mirror hung release v0.4.310 for 60 min.
        timeout-minutes: 15
        # libglib2.0-dev + libgstreamer1.0-dev are required to compile
        # `glib-sys` / `gstreamer-sys` (pulled in via gst-plugins-rs by the
        # NDI WebRTC pipeline). Without them the build fails with
        #   "Package 'glib-2.0', required by 'virtual:world', not found"
        # at the glib-sys build script.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            protobuf-compiler cmake nasm binaryen brotli pigz
            libglib2.0-dev
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
            libgstreamer-plugins-bad1.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install nightly toolchain (WASM MVP build)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-on-failure: false

      - name: Cache trunk binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-${{ runner.os }}-

      # Trunk downloads wasm-bindgen straight from GitHub's release CDN at
      # BUILD time (not via cargo/crates.io) — a transient CDN blip there
      # fails the whole Build job even though nothing in our own pipeline
      # changed (see pipeline.yml's identical step for the incident that
      # prompted this). Caching trunk's own tool-download dir means the
      # tarball is fetched once and reused across runs. A cache MISS still
      # falls through to a live download — this is a resilience+speed layer,
      # never a new dependency. Keyed on presenter-ui's OWN Cargo.lock:
      # presenter-ui is excluded from the root workspace (see root
      # Cargo.toml) and has its own separate lockfile that pins the exact
      # wasm-bindgen version trunk needs.
      - name: Cache trunk-downloaded tools (wasm-bindgen)
        uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('crates/presenter-ui/Cargo.lock') }}
          restore-keys: trunk-tools-${{ runner.os }}-

      - name: Install trunk
        run: command -v trunk >/dev/null 2>&1 || cargo install trunk --locked

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Build WASM UI
        run: bash scripts/build-ui.sh

      - name: Build release binaries
        run: cargo build --release -p presenter-server -p presenter-importer
        env:
          PRESENTER_BUILD_CHANNEL: release

      - name: Set up JDK 17 (Android Stage APK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Stage APK
        working-directory: android/presenter-stage
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK into release dir
        run: cp android/presenter-stage/app/build/outputs/apk/debug/app-debug.apk target/release/presenter-stage.apk

      - name: Verify prod artifact has no test-only features
        run: |
          if strings target/release/presenter-server | grep -E "mock_integrations|MOCK_RESOLUME_ADDR|MOCK_ABLESET_ADDR|mock-resolume|mock-ableset|kill_pipeline_for_test|simulate_error_for_test|simulate_pipeline_error" >/dev/null; then
            echo "::error::Prod build contains test-only symbols (mock-integrations or test-helpers). Rebuild without --features mock-integrations,test-helpers."
            exit 1
          fi
          echo "Prod artifact verified: no test-only symbols"

      # #859: the tarball is a PUBLIC release asset, so it carries only the
      # public-domain modules: data/bibles/ holds exactly the allow-list of
      # scripts/ci/check_public_bibles.py (today kjv.usfm.zip). SEB / Roháček /
      # SEVP / Milosť are licence-restricted: this job never checks out the
      # private repo (the checker fails if it does), and PP gets them from
      # deploy-pp's "Deploy Bible files".
      - name: Create release archive
        run: |
          mkdir -p release/bibles release/libraries
          cp target/release/presenter-server release/
          cp target/release/import_propresenter release/
          cp target/release/ingest_bibles release/
          cp target/release/presenter-stage.apk release/
          cp data/bibles/*.zip release/bibles/
          cp -r data/libraries/* release/libraries/
          # #850 A1a: the binaries embed the book-name table generated from MIT /
          # CC BY sources, so the notices and the MIT text ship with them (same
          # relative path the notices name).
          cp THIRD_PARTY_NOTICES.md release/
          mkdir -p release/data/bible-book-names
          cp data/bible-book-names/LICENSE-BPRP.md release/data/bible-book-names/
          tar -czvf presenter-${{ github.event.release.tag_name }}-linux-x64.tar.gz -C release .

      - name: Upload release artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: presenter-${{ github.event.release.tag_name }}-linux-x64.tar.gz

      # deploy-site.yml (#1004) pulls the artifact named build-artifacts of this run.
      - name: Upload binaries for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            target/release/presenter-server
            target/release/import_propresenter
            target/release/ingest_bibles
            target/release/presenter-stage.apk

  # #1004: PP is a hardware site like SNV, so it runs the SAME reusable site deploy
  # (deploy-site.yml, #918) instead of a hand-kept copy of the old SNV job: its own service user
  # (#929), the Dante listening drop-ins (#852/#925), the guest-only listener + its check (#999),
  # the staged pull deploy and the schema gate that never touches the running service.
  # deploy-site.yml lists this run's artifacts through the API (the staged pull), hence actions: read.
  deploy-pp:
    name: Deploy to companion-pp.lan
    needs: build-release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
    with:
      site: PP
      deploy_host: companion-pp.lan
      deploy_user: newlevel
      # #929: the service's own user, like SNV; newlevel stays only the SSH login of the deploy.
      service_user: presenter
      deploy_dir: /opt/presenter
      service_name: presenter
      unit_file: scripts/deploy/presenter.service
      etc_dir: /etc/presenter
      http_port: "80"
      hardware: true
      library_sync: true
      # #469: PP is GPU-less (no working VA-API), vah264enc is legitimately absent.
      vaapi_required: false
      # #915: PP's Access app 68322373 (prpp.newlevel.media).
      access_aud: d1ae757988a1592984b19685b43280e95e2b111dd025ee360ebdbb8f6c4352c7
      # #999: the guest-only listener (a public guest tunnel must point here, never at :80) and the
      # guests' public hostname (QR page only), a repository variable — unset = port only.
      guest_port: "8099"
      guest_host: ${{ vars.PP_GUEST_HOST }}
      # #470/#538: PP's stage TV opens PP; #555: PP pulls songs from SNV over tailscale.
      stage_url: ${{ vars.PP_STAGE_URL || 'http://10.77.8.205/stage' }}
      sync_peer_url: http://100.122.204.47
