name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # libglib2.0-dev + libgstreamer1.0-dev are required to compile the
        # `glib-sys`/`gstreamer-sys` crates that the NDI WebRTC pipeline
        # pulled in via gst-plugins-rs. Pre-WebRTC the build only needed
        # protobuf+cmake+nasm; after PR #330 (NDI WebRTC migration) the
        # release build will fail at glib-sys with
        #   "Package 'glib-2.0', required by 'virtual:world', not found"
        # unless the GStreamer dev headers are installed. Same dependency
        # set as the dev pipeline's Build job in pipeline.yml.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            protobuf-compiler cmake nasm \
            libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install nightly toolchain (WASM MVP build)
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-on-failure: false

      - name: Cache trunk binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-${{ runner.os }}-

      # Trunk downloads wasm-bindgen straight from GitHub's release CDN at
      # BUILD time (not via cargo/crates.io) — a transient CDN blip there
      # fails the whole Build job even though nothing in our own pipeline
      # changed (see pipeline.yml's identical step for the incident that
      # prompted this). Caching trunk's own tool-download dir means the
      # tarball is fetched once and reused across runs. A cache MISS still
      # falls through to a live download — this is a resilience+speed layer,
      # never a new dependency. Keyed on presenter-ui's OWN Cargo.lock:
      # presenter-ui is excluded from the root workspace (see root
      # Cargo.toml) and has its own separate lockfile that pins the exact
      # wasm-bindgen version trunk needs.
      - name: Cache trunk-downloaded tools (wasm-bindgen)
        uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('crates/presenter-ui/Cargo.lock') }}
          restore-keys: trunk-tools-${{ runner.os }}-

      - name: Install trunk
        run: command -v trunk >/dev/null 2>&1 || cargo install trunk --locked

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Build WASM UI
        run: bash scripts/build-ui.sh

      - name: Build release binaries
        run: cargo build --release -p presenter-server -p presenter-importer
        env:
          PRESENTER_BUILD_CHANNEL: release

      - name: Set up JDK 17 (Android Stage APK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Stage APK
        working-directory: android/presenter-stage
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK into release dir
        run: cp android/presenter-stage/app/build/outputs/apk/debug/app-debug.apk target/release/presenter-stage.apk

      - name: Verify prod artifact has no test-only features
        run: |
          if strings target/release/presenter-server | grep -E "mock_integrations|MOCK_RESOLUME_ADDR|MOCK_ABLESET_ADDR|mock-resolume|mock-ableset|kill_pipeline_for_test|simulate_error_for_test|simulate_pipeline_error" >/dev/null; then
            echo "::error::Prod build contains test-only symbols (mock-integrations or test-helpers). Rebuild without --features mock-integrations,test-helpers."
            exit 1
          fi
          echo "Prod artifact verified: no test-only symbols"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            target/release/presenter-server
            target/release/import_propresenter
            target/release/ingest_bibles
            target/release/presenter-stage.apk

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build
    env:
      DEPLOY_DIR: /opt/presenter
      SERVICE_NAME: presenter
      DEPLOY_HOST: 10.77.9.205
      DEPLOY_USER: newlevel
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: _artifacts

      - name: Place binaries
        run: |
          mkdir -p target/release
          cp _artifacts/presenter-server target/release/
          cp _artifacts/import_propresenter target/release/
          cp _artifacts/ingest_bibles target/release/
          cp _artifacts/presenter-stage.apk target/release/
          chmod +x target/release/presenter-server target/release/import_propresenter target/release/ingest_bibles
          ls -la target/release/presenter-server target/release/import_propresenter target/release/ingest_bibles target/release/presenter-stage.apk

      - name: Setup SSH for deployment
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # #674: drop any STALE key for this host first, so a re-deploy never
          # accumulates duplicate entries for the same host (the dominant
          # source of this file's unbounded growth on a persistent self-hosted
          # runner). Best-effort — a first-ever run has nothing to remove.
          ssh-keygen -R ${{ env.DEPLOY_HOST }} -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          # #674: a bare `ssh-keyscan ... 2>/dev/null` here used to abort the
          # WHOLE step via this step's `-e` shell the instant keyscan itself
          # returned non-zero (a transient connect timeout) — BEFORE ever
          # reaching the emptiness guard below that was written to diagnose
          # exactly that failure. Wrapping the call in `if ...; then` exempts
          # it from `-e`; the retry loop then also tolerates a genuine blip.
          KEYSCAN_OK=0
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 5 ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null; then
              KEYSCAN_OK=1
              break
            fi
            echo "ssh-keyscan attempt $attempt/5 failed, retrying in 3s..."
            sleep 3
          done
          if [ "$KEYSCAN_OK" -ne 1 ] || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan failed after 5 attempts — known_hosts is empty. Cannot verify host."
            exit 1
          fi
          cat > ~/.ssh/config <<EOF
          Host deploy-target
              HostName ${{ env.DEPLOY_HOST }}
              User ${{ env.DEPLOY_USER }}
              IdentityFile ~/.ssh/id_deploy
          EOF

      - name: Create deploy directory
        run: |
          ssh deploy-target "sudo mkdir -p ${{ env.DEPLOY_DIR }} && sudo chown -R ${{ env.DEPLOY_USER }}:${{ env.DEPLOY_USER }} ${{ env.DEPLOY_DIR }}"

      - name: Ensure ADB is installed
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          if ! command -v adb &> /dev/null; then
            echo "Installing ADB..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq android-tools-adb
          fi
          echo "ADB version: $(adb --version | head -1)"
          REMOTE_SCRIPT

      - name: Ensure NDI SDK and avahi-daemon are installed
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          # Install avahi-daemon for mDNS (NDI source discovery)
          if ! systemctl is-active --quiet avahi-daemon 2>/dev/null; then
            echo "Installing avahi-daemon..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq avahi-daemon
            sudo systemctl enable avahi-daemon
            sudo systemctl start avahi-daemon
          fi
          # Install NDI SDK if not present
          if [ ! -f /usr/lib/ndi/libndi.so.6 ]; then
            echo "Installing NDI SDK v6..."
            NDI_URL="https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz"
            curl -sL "$NDI_URL" -o /tmp/ndi_sdk.tar.gz
            cd /tmp && tar xzf ndi_sdk.tar.gz
            echo "y" | PAGER=cat sh /tmp/Install_NDI_SDK_v6_Linux.sh
            sudo mkdir -p /usr/lib/ndi
            sudo cp "/tmp/NDI SDK for Linux/lib/x86_64-linux-gnu/libndi.so.6.3.1" /usr/lib/ndi/
            sudo ln -sf libndi.so.6.3.1 /usr/lib/ndi/libndi.so.6
            sudo ln -sf libndi.so.6 /usr/lib/ndi/libndi.so
            rm -rf /tmp/ndi_sdk.tar.gz /tmp/Install_NDI_SDK_v6_Linux.sh "/tmp/NDI SDK for Linux"
            echo "NDI SDK installed"
          else
            echo "NDI SDK already present"
          fi
          ls -la /usr/lib/ndi/libndi.so.6
          REMOTE_SCRIPT

      - name: Ensure GStreamer + VA-API are installed
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          NEEDED="gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-vaapi gstreamer1.0-libav gstreamer1.0-nice intel-media-va-driver-non-free libva-drm2 libva2"
          MISSING=""
          for pkg in $NEEDED; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            echo "Installing missing packages:$MISSING"
            sudo apt-get update -qq
            sudo apt-get install -y -qq $MISSING
          fi
          # Probe that VAAPI H264 encoder is available
          if ! gst-inspect-1.0 vah264enc >/dev/null 2>&1; then
            echo "::error::vah264enc element not available after install — VA-API driver missing or kernel/firmware mismatch"
            exit 1
          fi
          echo "vah264enc available: $(gst-inspect-1.0 vah264enc | head -1)"
          REMOTE_SCRIPT

      # STAGED deploy, PULL model: the runner→prod point-to-point path can be
      # crippled (~21 KB/s over the inter-site bridge AND tailscale when the
      # rig travels), while prod's own INTERNET stays fast (measured 4.2 MB/s
      # from GitHub). So prod downloads the build artifact straight from
      # GitHub via a short-lived signed URL instead of receiving an scp push.
      # The service KEEPS RUNNING throughout; a later step stops → swaps →
      # starts with seconds of downtime. sha256 sums computed on the runner
      # guard the download's integrity.
      - name: Stage binaries on prod (pull from GitHub, service keeps running)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="build-artifacts") | .id')
          test -n "$ARTIFACT_ID" || { echo "::error::build-artifacts artifact not found for this run"; exit 1; }
          SUMS=$(cd _artifacts && sha256sum presenter-server import_propresenter ingest_bibles presenter-stage.apk)
          ssh deploy-target "mkdir -p ${{ env.DEPLOY_DIR }}/staging.new"
          # The signed URL from the 302 redirect is valid ~1 minute — resolve it
          # LAST and hand it straight to prod's curl (no token leaves the runner).
          SIGNED_URL=$(curl -sI -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          test -n "$SIGNED_URL" || { echo "::error::could not resolve the signed artifact URL"; exit 1; }
          ssh deploy-target "set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}/staging.new
            curl -sL --max-time 300 -o build-artifacts.zip '$SIGNED_URL'
            unzip -oq build-artifacts.zip && rm build-artifacts.zip
            printf '%s\n' '$SUMS' | sha256sum -c --quiet
            chmod +x presenter-server import_propresenter ingest_bibles
            ls -la"

      # The APK rides the same pulled artifact; it is swapped into place
      # together with the binaries (the running service may be serving the
      # old file until then).

      # #660: re-downloads whenever the PINNED version differs from what's on
      # disk (tracked via a `.cliproxy-version` marker file), not only when
      # the binary is entirely missing — before this fix, bumping
      # CLIPROXY_VERSION above did nothing on an already-provisioned host
      # (prod ran the 2026-03-23 build of v6.9.1 for months despite this
      # workflow source having been edited since). Runs as a single remote
      # heredoc (not a locally-interpolated double-quoted string) so
      # $CURRENT_VERSION is read and compared ON THE REMOTE HOST.
      #
      # #675 review finding 1: THIS workflow uses the STAGED-PULL model — the
      # OLD presenter-server (and its `cli-proxy-api` CHILD process,
      # auto_start=true, `ai/proxy.rs`) keeps serving until the much-later
      # "Swap staged binaries and restart service" step. Downloading straight
      # into "${{ env.DEPLOY_DIR }}/cli-proxy-api" would `tar xz` OVER the
      # same inode the live child has mapped (GNU tar rewrites the existing
      # file in place, it does not unlink+recreate) — several minutes of DB
      # backup / schema validation / bible+library sync run between this step
      # and the restart, so a page fault into the half-written binary during
      # that window can crash or corrupt the still-running proxy. Stage into
      # a scratch dir on the SAME filesystem and `mv -f` into place instead —
      # exactly the pattern the "Stage binaries on prod" step above already
      # uses for presenter-server itself (`staging.new/` + the swap step's
      # `mv -f`). A rename is atomic: the OLD inode stays valid for whatever
      # still has it open, and the NEW binary is only what the NEXT process
      # start picks up. DO NOT "fix" this by reordering the step to run after
      # the restart instead — that only shrinks the live-overwrite window (a
      # freshly-restarted auto_start child would still be running against
      # this same file), it does not remove the hazard; the atomic rename
      # removes it outright and needs no ordering assumption to stay correct.
      - name: Deploy CLIProxyAPI
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          CLIPROXY_VERSION="7.2.130"
          CLIPROXY_URL="https://github.com/router-for-me/CLIProxyAPI/releases/download/v${CLIPROXY_VERSION}/CLIProxyAPI_${CLIPROXY_VERSION}_linux_amd64.tar.gz"
          VERSION_FILE="${{ env.DEPLOY_DIR }}/.cliproxy-version"
          CURRENT_VERSION=$(cat "$VERSION_FILE" 2>/dev/null || echo "")
          if [ ! -f "${{ env.DEPLOY_DIR }}/cli-proxy-api" ] || [ "$CURRENT_VERSION" != "$CLIPROXY_VERSION" ]; then
            echo "Downloading CLIProxyAPI v${CLIPROXY_VERSION} (was: ${CURRENT_VERSION:-none})..."
            TMP_DIR=$(mktemp -d "${{ env.DEPLOY_DIR }}/.cliproxy-download.XXXXXX")
            curl -sL "$CLIPROXY_URL" | tar xz -C "$TMP_DIR/"
            chmod +x "$TMP_DIR/cli-proxy-api"
            mv -f "$TMP_DIR/cli-proxy-api" "${{ env.DEPLOY_DIR }}/cli-proxy-api"
            rm -rf "$TMP_DIR"
            echo "$CLIPROXY_VERSION" > "$VERSION_FILE"
            echo "CLIProxyAPI deployed (atomic swap — the old binary's inode, if still mapped by a live child, is untouched)"
          else
            echo "CLIProxyAPI already at v${CURRENT_VERSION}"
          fi
          REMOTE_SCRIPT

      - name: Backup database
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          DB_PATH="/opt/presenter/presenter.db"
          BACKUP_DIR="/opt/presenter/backups"
          mkdir -p "$BACKUP_DIR"
          if [ -f "$DB_PATH" ] && [ -s "$DB_PATH" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            cp "$DB_PATH" "${BACKUP_DIR}/presenter-${TIMESTAMP}.db"
            echo "Database backed up to ${BACKUP_DIR}/presenter-${TIMESTAMP}.db"
            ls -t "$BACKUP_DIR"/presenter-*.db 2>/dev/null | tail -n +6 | xargs -r rm --
          else
            echo "No existing database to back up"
          fi
          REMOTE_SCRIPT

      - name: Validate database schema
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          DB_PATH="/opt/presenter/presenter.db"
          if [ ! -f "$DB_PATH" ] || [ ! -s "$DB_PATH" ]; then
            echo "No database - will be created on first start"
            exit 0
          fi
          echo "Validating schema compatibility with new binary..."
          TEST_DB="/tmp/presenter-schema-test-$$.db"
          cp "$DB_PATH" "$TEST_DB"
          PRESENTER_DB_URL="sqlite://$TEST_DB" PRESENTER_PORT=0 \
            timeout 10 /opt/presenter/presenter-server &
          SERVER_PID=$!
          sleep 3
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Schema is compatible"
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
          else
            echo "::error::New binary failed to start with existing database — migration is broken. Fix the migration before deploying."
            rm -f "$TEST_DB" "${TEST_DB}-wal" "${TEST_DB}-shm"
            exit 1
          fi
          rm -f "$TEST_DB" "${TEST_DB}-wal" "${TEST_DB}-shm"
          REMOTE_SCRIPT

      - name: Deploy Bible files
        run: |
          ssh deploy-target "mkdir -p ${{ env.DEPLOY_DIR }}/bibles"
          scp -i ~/.ssh/id_deploy \
            data/bibles/kjv.usfm.zip \
            data/bibles/seb.bbl.mybible.zip \
            data/bibles/rohacek.bbl.mybible.zip \
            data/bibles/sevp.obohu.mybible.zip \
            data/bibles/milost.bbl.mybible.zip \
            deploy-target:${{ env.DEPLOY_DIR }}/bibles/

      # #730: keep the llmrot channel script fresh on every prod deploy. The
      # one-time authorized_keys line for claudy's key is provisioned
      # separately (deploy/llmrot-provision.sh, run manually per host) —
      # deliberately NOT in per-push CI. Runs as the deploy user (newlevel),
      # no sudo — the deploy dir is newlevel-owned.
      - name: Deploy llmrot channel script (#730)
        run: |
          scp -i ~/.ssh/id_deploy deploy/llmrot-apply.sh deploy-target:${{ env.DEPLOY_DIR }}/llmrot-apply
          ssh deploy-target "chmod +x ${{ env.DEPLOY_DIR }}/llmrot-apply"

      - name: Sync ProPresenter libraries from git
        run: |
          command -v rsync >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          ssh deploy-target "mkdir -p ${{ env.DEPLOY_DIR }}/libraries"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy" \
            data/libraries/ \
            deploy-target:${{ env.DEPLOY_DIR }}/libraries/

      - name: Import ProPresenter (first deploy or schema reset)
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          DB_PATH="/opt/presenter/presenter.db"
          if [ ! -f "$DB_PATH" ] || [ ! -s "$DB_PATH" ]; then
            echo "Fresh database - running ProPresenter import"
            PRESENTER_DB_URL=sqlite:///opt/presenter/presenter.db \
              /opt/presenter/import_propresenter --root "/opt/presenter/libraries"
          else
            echo "Existing database found - preserving presentations"
          fi
          REMOTE_SCRIPT

      - name: Import Bible translations
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          echo "Importing Bible translations..."
          export PRESENTER_DB_URL=sqlite:///opt/presenter/presenter.db
          export PRESENTER_BIBLE_KJV=/opt/presenter/bibles/kjv.usfm.zip
          export PRESENTER_BIBLE_SEB=/opt/presenter/bibles/seb.bbl.mybible.zip
          export PRESENTER_BIBLE_ROHACEK=/opt/presenter/bibles/rohacek.bbl.mybible.zip
          export PRESENTER_BIBLE_SEVP=/opt/presenter/bibles/sevp.obohu.mybible.zip
          export PRESENTER_BIBLE_MILOST=/opt/presenter/bibles/milost.bbl.mybible.zip
          /opt/presenter/ingest_bibles
          REMOTE_SCRIPT

      - name: Deploy systemd service
        env:
          # #538: the stage URL is PER SITE and no longer lives in the shared unit —
          # each deploy writes its own drop-in. SNV prod points its TVs at itself.
          # Passed through `env:` rather than interpolated straight into the shell line:
          # the value ends up inside a remote ssh command, where a quote in it would run
          # as a command under passwordless sudo.
          PROD_STAGE_URL: ${{ vars.PROD_STAGE_URL || 'http://10.77.9.205/stage' }}
        run: |
          scp -i ~/.ssh/id_deploy scripts/deploy/presenter.service deploy-target:/tmp/presenter.service
          # #539: the encoder-ready gate the unit calls from ExecStartPre.
          scp -i ~/.ssh/id_deploy scripts/deploy/wait-for-h264-encoder.sh deploy-target:/tmp/wait-for-h264-encoder.sh
          # #544: the service's GStreamer registry must not survive this deploy — a driver
          # or permission change would otherwise keep being judged by the old cache.
          ssh deploy-target "sudo cp /tmp/presenter.service /etc/systemd/system/ && \
            sudo install -m 0755 /tmp/wait-for-h264-encoder.sh ${{ env.DEPLOY_DIR }}/wait-for-h264-encoder.sh && \
            sudo rm -f ${{ env.DEPLOY_DIR }}/gstreamer-registry.bin && \
            sudo mkdir -p /etc/systemd/system/presenter.service.d && \
            sudo systemctl daemon-reload"
          # A newline in the variable would inject arbitrary [Service] directives into the
          # drop-in — accept only a single-line http(s) URL.
          case "$PROD_STAGE_URL" in
            *[$'\n\r']* | '') echo "::error::PROD_STAGE_URL must be a single-line URL"; exit 1 ;;
            http://* | https://*) ;;
            *) echo "::error::PROD_STAGE_URL must start with http:// or https://"; exit 1 ;;
          esac
          printf '[Service]\nEnvironment=PRESENTER_ANDROID_STAGE_URL=%s\n' "$PROD_STAGE_URL" |
            ssh deploy-target "sudo tee /etc/systemd/system/presenter.service.d/stage-url.conf >/dev/null && sudo systemctl daemon-reload"
          # #555: song-sync peer — SNV pulls from PP over tailscale (the two sites
          # have overlapping 10.77.8.0/23 LANs; tailscale is the only inter-site path).
          printf '[Service]\nEnvironment=PRESENTER_SYNC_PEER_URL=%s\n' "http://100.101.72.101" |
            ssh deploy-target "sudo tee /etc/systemd/system/presenter.service.d/sync-peer.conf >/dev/null && sudo systemctl daemon-reload"

      # #502: write the Cloudflare Realtime TURN credentials to a 0600 root-only
      # EnvironmentFile (the committed unit references it as `EnvironmentFile=-`).
      # Secrets — must NOT live in the committed unit. The value is passed via
      # the bash builtin printf (never in any process argv) piped over ssh stdin
      # (never in the remote argv / ps), and written under `umask 077` so the
      # file is 0600 from creation (no 0644 window). Unlike an inline
      # `Environment=` drop-in, EnvironmentFile values are NOT exposed by
      # `systemctl show`. When the secrets are unset, remove any stale file so
      # TURN cleanly disables (LAN-only).
      - name: Configure TURN credentials
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          set -euo pipefail
          SECRET_FILE=/etc/presenter/turn.env
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_API_TOKEN" ]; then
            ssh deploy-target "sudo install -d -m 755 /etc/presenter"
            printf 'PRESENTER_TURN_KEY_ID=%s\nPRESENTER_TURN_KEY_API_TOKEN=%s\n' \
              "$TURN_KEY_ID" "$TURN_KEY_API_TOKEN" \
              | ssh deploy-target "sudo sh -c 'umask 077 && cat > $SECRET_FILE'"
            echo "TURN credentials written to $SECRET_FILE (0600 root-only)"
          else
            ssh deploy-target "sudo rm -f $SECRET_FILE 2>/dev/null || true"
            echo "TURN secrets unset — TURN disabled (LAN-only); any stale secret file removed"
          fi
          ssh deploy-target "sudo systemctl daemon-reload"

      # The transfers above ran with the OLD service still serving. Downtime
      # window = this single step: stop → swap the staged binaries into place
      # → start. Seconds, not the length of a slow-bridge transfer.
      - name: Swap staged binaries and restart service
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -euo pipefail
          cd "${{ env.DEPLOY_DIR }}"
          test -x staging.new/presenter-server || { echo "::error::staged presenter-server missing/not executable — aborting before touching the running service"; exit 1; }
          if systemctl is-active --quiet ${{ env.SERVICE_NAME }}; then sudo systemctl stop ${{ env.SERVICE_NAME }}; echo 'Service stopped'; fi
          mv -f staging.new/presenter-server staging.new/import_propresenter staging.new/ingest_bibles staging.new/presenter-stage.apk .
          rmdir staging.new 2>/dev/null || true
          sudo systemctl enable ${{ env.SERVICE_NAME }} && sudo systemctl start ${{ env.SERVICE_NAME }}
          REMOTE_SCRIPT

      - name: Verify deployment
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          if ! systemctl is-active --quiet presenter; then
            echo "::error::Service failed to start"
            sudo journalctl -u presenter -n 50 --no-pager
            exit 1
          fi
          echo "Service is running"

          # Poll /healthz until the port is bound. systemd reports the service
          # active before tokio finishes binding; a fixed sleep raced with
          # cold start (DB migration + library/Bible load). 60s max.
          HEALTH=""
          for attempt in $(seq 1 30); do
            if HEALTH=$(curl -sf http://localhost:80/healthz 2>/dev/null); then
              break
            fi
            sleep 2
          done
          if [ -z "$HEALTH" ]; then
            echo "::error::Post-deploy health check FAILED — /healthz did not respond within 60s"
            sudo journalctl -u presenter -n 50 --no-pager
            exit 1
          fi
          echo "Health check passed: $HEALTH"

          if ! LIBS=$(curl -sf http://localhost:80/libraries/summary); then
            echo "::error::Post-deploy data check FAILED — /libraries/summary did not respond"
            exit 1
          fi
          if [ "$LIBS" = "[]" ]; then
            echo "::error::Post-deploy data check FAILED — database appears empty"
            exit 1
          fi
          echo "Data check passed: libraries endpoint returned data"
          REMOTE_SCRIPT

      - name: Post-deploy smoke test
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:80/stage)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Stage display returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Stage display: OK (HTTP 200)"

          curl -sf http://localhost:80/stage/snapshot > /dev/null
          echo "Stage snapshot API: OK"

          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:80/ui/operator)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Operator UI returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Operator UI: OK (HTTP 200)"
          REMOTE_SCRIPT

      # #661 added this AI-path check; #675 review finding 2 fixed two bugs
      # in it. (1) It used to sit INSIDE "Verify deployment", BEFORE the core
      # smoke test above — an AI-side failure aborted the job via `if:
      # success()` and skipped the smoke test that proves the actual
      # lyrics/stage feature still works, so an unrelated AI hiccup could
      # mask a real regression. Now it runs AFTER the smoke test. (2) It used
      # to hard-fail on the aggregate `connected` field, which ANDs
      # connectivity + Claude-OAuth-auth + model-validity — but the Claude
      # OAuth token is DOCUMENTED to die silently every ~8h (#660) for
      # reasons that have nothing to do with what THIS deploy shipped, so
      # failing a PRODUCTION deploy over a coincidentally-stale token is
      # wrong. Only `modelValid` is asserted as a hard gate: `check_status`
      # (`router/ai.rs`) defaults it PERMISSIVELY to `true` whenever the
      # model catalog itself couldn't be fetched (dead token, proxy down,
      # network blip), so it can only be `false` when the proxy answered its
      # catalog AND the CONFIGURED model genuinely isn't in it — the one
      # AI-side failure mode a code/config change in this deploy could
      # actually cause (the exact #661 incident: an invalid model id sat
      # green for 4 days). `continue-on-error: true` is banned in this repo
      # (`ci/no-continue-on-error`, see this repo's CLAUDE.md) —
      # "non-blocking" here means the step itself never fails on these
      # signals in the first place, not that a failing step is ignored.
      - name: Verify AI status
        run: |
          ssh deploy-target << 'REMOTE_SCRIPT'
          set -e
          if ! AI_STATUS=$(curl -sf http://localhost:80/ai/status); then
            echo "::warning::Post-deploy AI check — /ai/status did not respond (non-blocking; this alone does not fail a production deploy)"
          else
            if printf '%s' "$AI_STATUS" | grep -q '"modelValid":false'; then
              echo "::error::Post-deploy AI check FAILED — configured AI model is not in the proxy's model catalog: $AI_STATUS"
              exit 1
            fi
            if printf '%s' "$AI_STATUS" | grep -q '"connected":true'; then
              echo "AI check passed: $AI_STATUS"
            else
              echo "::warning::AI is not fully connected post-deploy (stale Claude OAuth token or proxy unreachable — non-blocking, re-login via /ai panel when convenient): $AI_STATUS"
            fi
          fi
          REMOTE_SCRIPT

      - name: Show deployment info
        run: |
          echo "=== Deployment Complete ==="
          echo "Version: $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "Service: ${{ env.SERVICE_NAME }}"
          ssh deploy-target "systemctl status ${{ env.SERVICE_NAME }} --no-pager" || true

      - name: Install & configure cloudflared (skipped if vars unset)
        if: ${{ vars.CLOUDFLARED_TUNNEL_ID_PROD != '' && vars.CLOUDFLARED_HOSTNAME_PROD != '' }}
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARED_CREDS_PROD }}
        run: |
          set -euo pipefail
          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "::error::CLOUDFLARED_CREDS_PROD secret is empty. Register the tunnel token in repo settings."
            exit 1
          fi
          ssh deploy-target "set -euo pipefail
            if ! command -v cloudflared >/dev/null 2>&1; then
              wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -O /tmp/cf.deb
              sudo dpkg -i /tmp/cf.deb
              rm /tmp/cf.deb
            fi
            sudo cloudflared service uninstall 2>/dev/null || true
            sudo cloudflared service install ${TUNNEL_TOKEN}
            sudo systemctl enable --now cloudflared
          "
