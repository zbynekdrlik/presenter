name: apt-install
description: >-
  Install apt packages on a GitHub-hosted runner through scripts/ci/apt-install.sh,
  with the downloaded .deb files cached per package list. On 2026-11-23 the
  Ubuntu mirrors sent < 1.6 MB/s and the 274 MB gstreamer set ran out of both
  bounded attempts; with the cache a job downloads only what changed. A run
  that added .debs (a failed one too) saves them under a new key; the newest
  key of the package list is restored, so a steady state saves nothing.
inputs:
  packages:
    description: Space-separated apt package names.
    required: true
runs:
  using: composite
  steps:
    - name: apt cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # word splitting of the package list is intended
        list=$(printf '%s\n' $PACKAGES | sort -u | tr '\n' ' ')
        echo "prefix=apt-v2-${RUNNER_OS}-${RUNNER_ARCH}-$(printf '%s' "$list" | sha256sum | cut -c1-16)-" >> "$GITHUB_OUTPUT"
        echo "dir=$HOME/.cache/apt-archives" >> "$GITHUB_OUTPUT"
    - name: Restore apt archives
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: apt-get install
      id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        APT_ARCHIVES: ${{ steps.key.outputs.dir }}
        APT_NEW_DEBS_OUTPUT: ${{ runner.temp }}/apt-new-debs
      run: |
        set -euo pipefail
        trap 'cat "$APT_NEW_DEBS_OUTPUT" >> "$GITHUB_OUTPUT" 2>/dev/null || true' EXIT
        # shellcheck disable=SC2086 # word splitting of the package list is intended
        bash "$GITHUB_WORKSPACE/scripts/ci/apt-install.sh" $PACKAGES
    - name: Save apt archives
      if: always() && steps.install.outputs.new_debs != '' && steps.install.outputs.new_debs != '0'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
